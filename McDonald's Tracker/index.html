<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McDo Caen — Menu Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0b0e14;
      --surface:    #12161f;
      --surface2:   #1a1f2e;
      --border:     #2a3148;
      --gold:       #ffbc00;
      --gold-dim:   #c9920a;
      --red:        #da2020;
      --green:      #27c160;
      --text:       #e8ecf4;
      --text-dim:   #7a849e;
      --panel-w:    420px;
      --search-w:   300px;
      --font-title: 'Bebas Neue', sans-serif;
      --font-body:  'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }

    /* ── Boot overlay ───────────────────────────────────────────── */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .6s ease;
    }
    #boot.out { opacity: 0; pointer-events: none; }

    .boot-logo   { font-family: var(--font-title); font-size: 68px; color: var(--gold); letter-spacing: 4px; line-height: 1; }
    .boot-sub    { font-size: 12px; color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; margin-bottom: 40px; }

    .boot-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 26px 32px; width: 380px; display: flex; flex-direction: column; gap: 16px;
    }
    .boot-headline { font-size: 13px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    .boot-headline .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.65)} }

    .boot-bar-wrap { background: var(--surface2); border-radius: 99px; height: 5px; overflow: hidden; }
    .boot-bar      { height: 100%; width: 0%; background: linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius: 99px; transition: width .5s ease; }

    .boot-counter  { font-size: 11px; color: var(--text-dim); text-align: right; font-weight: 600; }

    .boot-pills    { display: flex; flex-wrap: wrap; gap: 6px; }
    .boot-pill {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--border); color: var(--text-dim); background: var(--surface2);
      transition: all .3s;
    }
    .boot-pill.active { border-color: var(--gold); color: var(--gold); }
    .boot-pill.done   { border-color: var(--green); color: var(--green); }
    .boot-pill.error  { border-color: var(--red);   color: var(--red);   }

    .boot-skip {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 8px; padding: 9px 0; font-family: var(--font-body); font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all .2s; margin-top: 4px;
    }
    .boot-skip:hover { border-color: var(--text-dim); color: var(--text); }

    /* ── App layout ─────────────────────────────────────────────── */
    #app { display: flex; height: 100vh; width: 100vw; }

    /* ── Carte ──────────────────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map      { width: 100%; height: 100%; background: var(--bg); }

    #map-header {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 900;
      background: rgba(11,14,20,.88); border: 1px solid var(--border); backdrop-filter: blur(10px);
      border-radius: 30px; padding: 8px 22px; display: flex; align-items: center; gap: 10px; pointer-events: none;
    }
    #map-header .logo { font-family: var(--font-title); font-size: 22px; color: var(--gold); letter-spacing: 1px; }
    #map-header .sub  { font-size: 12px; color: var(--text-dim); font-weight: 500; }

    #theme-btn {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 900;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 7px 14px; font-family: var(--font-body); font-size: 12px;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    #theme-btn:hover { background: var(--border); }

    #map-hint {
      position: absolute; bottom: 18px; right: 60px; z-index: 900;
      background: rgba(11,14,20,.8); border: 1px solid var(--border); backdrop-filter: blur(8px);
      border-radius: 20px; padding: 6px 18px; font-size: 12px; color: var(--text-dim); pointer-events: none;
      transition: opacity .4s;
    }
    #map-hint.hidden { opacity: 0; }

    /* ── Onglet recherche (tab gauche) ──────────────────────────── */
    #search-tab {
      position: absolute; top: 50%; left: 0; transform: translateY(-50%); z-index: 950;
      background: var(--surface2); border: 1px solid var(--border); border-left: none;
      border-radius: 0 8px 8px 0; padding: 18px 7px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: var(--gold); transition: background .2s, opacity .25s ease;
    }
    #search-tab:hover { background: var(--border); }
    #search-tab.shifted { opacity: 0; pointer-events: none; }
    #search-tab .tab-icon  { font-size: 16px; }
    #search-tab .tab-label {
      font-family: var(--font-title); font-size: 12px; letter-spacing: 2px;
      writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
    }

    /* ── Panneau recherche (drawer gauche) ──────────────────────── */
    #search-panel {
      position: absolute; top: 0; left: calc(-1 * var(--search-w)); width: var(--search-w); height: 100%;
      z-index: 940; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; transition: left .3s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.4);
    }
    #search-panel.open { left: 0; }

    #sp-header {
      padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
      background: var(--surface2); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #sp-header .title { font-family: var(--font-title); font-size: 20px; color: var(--gold); letter-spacing: 1px; }
    #sp-close { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 5px; }
    #sp-close:hover { color: var(--text); }

    #sp-back {
      display: none; align-items: center; gap: 6px; padding: 8px 14px;
      border: none; border-bottom: 1px solid var(--border); background: none;
      color: var(--text-dim); font-family: var(--font-body); font-size: 12px; font-weight: 600;
      cursor: pointer; width: 100%; text-align: left; flex-shrink: 0; transition: color .15s;
    }
    #sp-back:hover { color: var(--gold); }
    #sp-back.visible { display: flex; }

    #sp-selected {
      display: none; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #sp-selected .label { font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
    #sp-selected .value { font-family: var(--font-title); font-size: 16px; color: var(--text); }
    #sp-selected.visible { display: block; }

    #sp-input-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
    #sp-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 32px 9px 12px; color: var(--text);
      font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color .2s;
    }
    #sp-input:focus { border-color: var(--gold); }
    #sp-input::placeholder { color: var(--text-dim); }
    #sp-clear {
      position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-dim); font-size: 15px;
      cursor: pointer; display: none; line-height: 1;
    }
    #sp-clear.visible { display: block; }
    #sp-clear:hover { color: var(--text); }

    #sp-legend {
      display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .leg { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .leg.found   { color: var(--gold); } .leg.found   .leg-dot { background: var(--gold); }
    .leg.missing { color: var(--red);  } .leg.missing .leg-dot { background: var(--red);  }
    .leg.unknown { color: var(--text-dim); } .leg.unknown .leg-dot { background: var(--text-dim); }

    #sp-results, #sp-resto-results {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }
    #sp-resto-results { display: none; }
    #sp-results::-webkit-scrollbar, #sp-resto-results::-webkit-scrollbar { width: 4px; }
    #sp-results::-webkit-scrollbar-thumb, #sp-resto-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sp-placeholder { padding: 28px 18px; text-align: center; color: var(--text-dim); font-size: 12px; line-height: 1.8; }
    .sp-placeholder .ic { font-size: 30px; margin-bottom: 8px; }

    .sri { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; animation: fadeUp .2s ease both; }
    .sri:hover { background: var(--surface2); }
    .sri-name  { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 2px; }
    .sri-price { font-family: var(--font-title); font-size: 13px; color: var(--gold); }
    .sri-count { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .rri { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; animation: fadeUp .2s ease both; }
    .rri-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rri-dot.found   { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .rri-dot.missing { background: var(--red);  box-shadow: 0 0 6px var(--red); }
    .rri-dot.unknown { background: var(--text-dim); }
    .rri-info { flex: 1; min-width: 0; }
    .rri-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rri-status { font-size: 11px; margin-top: 1px; }
    .rri-status.found   { color: var(--gold); }
    .rri-status.missing { color: var(--red); }
    .rri-status.unknown { color: var(--text-dim); }

    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    /* ── Panneau menu droit ─────────────────────────────────────── */
    #panel {
      width: var(--panel-w); min-width: var(--panel-w); background: var(--surface);
      border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
      transition: width .35s ease, min-width .35s ease;
    }
    #panel.collapsed { width: 0; min-width: 0; }

    #panel-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); }
    #panel-name {
      font-family: var(--font-title); font-size: 26px; color: var(--gold);
      letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #panel-meta { margin-top: 6px; font-size: 12px; color: var(--text-dim); display: flex; gap: 14px; align-items: center; }
    #panel-status {
      font-weight: 600; font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: rgba(39,193,96,.15); color: var(--green);
    }
    #panel-status.closed { background: rgba(122,132,158,.15); color: var(--text-dim); }
    #panel-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
    #panel-close:hover { color: var(--text); }

    #panel-empty {
      flex: 1; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 30px; text-align: center;
    }
    #panel-empty .ic  { font-size: 42px; }
    #panel-empty .msg { font-size: 13px; color: var(--text-dim); line-height: 1.6; }

    #panel-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
    #panel-content::-webkit-scrollbar { width: 5px; }
    #panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #cat-tabs {
      display: flex; border-bottom: 1px solid var(--border); overflow-x: auto;
      scrollbar-width: none; background: var(--surface2); flex-shrink: 0;
    }
    #cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; padding: 11px 16px; font-size: 11px; font-weight: 600;
      letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim);
      cursor: pointer; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .cat-tab:hover { color: var(--text); }
    .cat-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    #products-list { padding: 12px 0; }
    .product-card { padding: 14px 22px; border-bottom: 1px solid var(--border); transition: background .15s; animation: fadeUp .25s ease both; }
    .product-card:hover { background: var(--surface2); }
    .product-name  { font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 4px; }
    .product-desc  { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 6px; }
    .product-price { font-family: var(--font-title); font-size: 15px; color: var(--gold); letter-spacing: .5px; }

    /* Popup Leaflet */
    .leaflet-popup-content-wrapper {
      background: var(--surface2) !important; border: 1px solid var(--border) !important;
      border-radius: 8px !important; color: var(--text) !important; box-shadow: 0 4px 20px rgba(0,0,0,.5) !important;
    }
    .leaflet-popup-tip { background: var(--surface2) !important; }
    .leaflet-popup-content { font-family: var(--font-body); font-size: 13px; line-height: 1.5; margin: 10px 14px !important; }
    .popup-name { font-family: var(--font-title); font-size: 17px; color: var(--gold); margin-bottom: 4px; }
    .popup-btn {
      display: block; margin-top: 10px; padding: 7px 0; background: var(--gold); color: #000;
      text-align: center; border: none; border-radius: 6px; font-family: var(--font-title);
      font-size: 14px; letter-spacing: .5px; cursor: pointer; width: 100%; transition: background .2s;
    }
    .popup-btn:hover { background: var(--gold-dim); }
    .popup-btn.na { background: var(--border); color: var(--text-dim); cursor: default; }
  </style>
</head>
<body>

<!-- ── BOOT OVERLAY ─────────────────────────────────────────────────────── -->
<div id="boot">
  <div class="boot-logo">McDo Caen</div>
  <div class="boot-sub">Menu Explorer</div>
  <div class="boot-card">
    <div class="boot-headline">
      <span class="dot"></span>
      <span id="boot-label">Initialisation…</span>
    </div>
    <div class="boot-bar-wrap"><div class="boot-bar" id="boot-bar"></div></div>
    <div class="boot-counter" id="boot-counter">0 / 0</div>
    <div class="boot-pills" id="boot-pills"></div>
    <button class="boot-skip" id="boot-skip">Accéder à la carte avec les menus déjà chargés</button>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────────────────────────────── -->
<div id="app">

  <!-- Carte -->
  <div id="map-wrap">
    <div id="map-header">
      <span class="logo">McDo Caen</span>
      <span class="sub">Menu Explorer</span>
    </div>
    <div id="map"></div>
    <button id="theme-btn">☀️ Mode clair</button>
    <div id="map-hint" class="hidden">Clique sur un restaurant pour voir son menu</div>

    <!-- Onglet recherche -->
    <div id="search-tab">
      <span class="tab-icon">🔍</span>
      <span class="tab-label">RECHERCHE</span>
    </div>

    <!-- Drawer recherche -->
    <div id="search-panel">
      <div id="sp-header">
        <span class="title">Recherche</span>
        <button id="sp-close">✕</button>
      </div>
      <button id="sp-back">← Retour aux résultats</button>
      <div id="sp-selected">
        <div class="label">Produit recherché</div>
        <div class="value" id="sp-sel-text">—</div>
      </div>
      <div id="sp-input-wrap">
        <input id="sp-input" type="text" placeholder="Ex : Big Mac, McFlurry…" autocomplete="off">
        <button id="sp-clear">✕</button>
      </div>
      <div id="sp-legend">
        <span class="leg found"><span class="leg-dot"></span>Disponible</span>
        <span class="leg missing"><span class="leg-dot"></span>Absent</span>
        <span class="leg unknown"><span class="leg-dot"></span>Non scrappé</span>
      </div>
      <div id="sp-results">
        <div class="sp-placeholder"><div class="ic">🍔</div>Tape le nom d'un produit…</div>
      </div>
      <div id="sp-resto-results"></div>
    </div>
  </div>

  <!-- Panneau menu droit -->
  <div id="panel" class="collapsed">
    <div id="panel-header">
      <button id="panel-close">✕</button>
      <div id="panel-name">—</div>
      <div id="panel-meta">
        <span id="panel-status">Ouvert</span>
        <span id="panel-hours">—</span>
      </div>
    </div>
    <div id="panel-empty" style="display:none">
      <div class="ic">🚫</div>
      <div class="msg" id="panel-empty-msg">Menu indisponible.</div>
    </div>
    <div id="panel-content">
      <div id="cat-tabs"></div>
      <div id="products-list"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  ÉTAT GLOBAL
// ════════════════════════════════════════════════════════════════
const menuCache = {};   // storeId → { menu, horaires, jour }
const markerMap = {};   // storeId → L.marker
const markerOrigIcon = {};

const SCRAPPABLE = new Set([
  'fr_caen_centre','fr_caen_cote_de_nacre','fr_herouville',
  'fr_ouistreham','fr_rots','fr_ifs','fr_mondeville'
]);

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════════
//  CARTE LEAFLET
// ════════════════════════════════════════════════════════════════
const map = L.map('map', { zoomControl: false }).setView([49.185, -0.375], 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const darkTiles  = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:20 });
const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  { attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:20 });
darkTiles.addTo(map);
let isDark = true;

document.getElementById('theme-btn').addEventListener('click', () => {
  isDark = !isDark;
  if (isDark) {
    map.removeLayer(lightTiles); darkTiles.addTo(map);
    document.getElementById('theme-btn').textContent = '☀️ Mode clair';
  } else {
    map.removeLayer(darkTiles); lightTiles.addTo(map);
    document.getElementById('theme-btn').textContent = '🌙 Mode sombre';
  }
});

function makeIcon(state) {
  const urls = { open:'mcdonalds.png', closed:'mcdonalds-closed.png', unavail:'mcdonalds-unavail.png',
                 found:'mcdonalds.png', missing:'mcdonalds-unavail.png', unknown:'mcdonalds-closed.png' };
  const big = ['found','missing','unknown'].includes(state);
  return L.icon({ iconUrl: urls[state]||'mcdonalds.png',
    iconSize: big?[36,36]:[32,32], iconAnchor: big?[18,36]:[16,32], popupAnchor:[0,-34] });
}

// ════════════════════════════════════════════════════════════════
//  PANNEAU MENU DROIT
// ════════════════════════════════════════════════════════════════
const panel      = document.getElementById('panel');
const panelName  = document.getElementById('panel-name');
const panelStatus= document.getElementById('panel-status');
const panelHours = document.getElementById('panel-hours');
const panelCont  = document.getElementById('panel-content');
const panelEmpty = document.getElementById('panel-empty');
const catTabs    = document.getElementById('cat-tabs');
const prodList   = document.getElementById('products-list');

document.getElementById('panel-close').addEventListener('click', () => panel.classList.add('collapsed'));

function showPanelContent() {
  panelEmpty.style.display = 'none';
  panelCont.style.display  = 'flex';
  panelCont.style.flexDirection = 'column';
}
function showPanelEmpty(msg) {
  panelCont.style.display  = 'none';
  panelEmpty.style.display = 'flex';
  document.getElementById('panel-empty-msg').innerHTML = msg || 'Menu indisponible.';
}

function renderMenu(storeId) {
  const data = menuCache[storeId];
  if (!data || !data.menu || Object.keys(data.menu).length === 0) {
    showPanelEmpty('Aucun menu disponible pour ce restaurant.');
    return;
  }
  panelHours.textContent = data.jour ? `${data.jour} · ${data.horaires}` : data.horaires || '—';

  // Onglets
  catTabs.innerHTML = '';
  const cats = Object.keys(data.menu);
  cats.forEach((cat, i) => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (i === 0 ? ' active' : '');
    tab.textContent = cat;
    tab.addEventListener('click', () => {
      catTabs.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderProducts(data.menu[cat]);
    });
    catTabs.appendChild(tab);
  });
  renderProducts(data.menu[cats[0]]);
  showPanelContent();
}

function renderProducts(products) {
  prodList.innerHTML = '';
  products.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.animationDelay = (i * 20) + 'ms';
    card.innerHTML = `
      <div class="product-name">${esc(p.nom)}</div>
      ${p.desc ? `<div class="product-desc">${esc(p.desc)}</div>` : ''}
      <span class="product-price">${esc(p.prix)}</span>`;
    prodList.appendChild(card);
  });
}

window.openMenu = function(storeId) {
  const resto = (window._restaurants||[]).find(r => r.id === storeId);
  panel.classList.remove('collapsed');
  panelName.textContent = resto ? resto.name : storeId;
  panelStatus.textContent = 'Ouvert';
  panelStatus.className = '';
  panelHours.textContent = '—';
  document.getElementById('map-hint').classList.add('hidden');
  map.closePopup();
  renderMenu(storeId);  // ← toujours depuis le cache
};

// ════════════════════════════════════════════════════════════════
//  PANNEAU RECHERCHE
// ════════════════════════════════════════════════════════════════
const searchTab    = document.getElementById('search-tab');
const searchPanel  = document.getElementById('search-panel');
const spResults    = document.getElementById('sp-results');
const spRestoRes   = document.getElementById('sp-resto-results');
const spBack       = document.getElementById('sp-back');
const spSelected   = document.getElementById('sp-selected');
const spSelText    = document.getElementById('sp-sel-text');
const spInput      = document.getElementById('sp-input');
const spClear      = document.getElementById('sp-clear');

let searchOpen = false;
let activeQuery = '';

function toggleSearch(open) {
  searchOpen = (open !== undefined) ? open : !searchOpen;
  searchPanel.classList.toggle('open', searchOpen);
  searchTab.classList.toggle('shifted', searchOpen);
  if (searchOpen) spInput.focus();
}

searchTab.addEventListener('click', () => toggleSearch());
document.getElementById('sp-close').addEventListener('click', () => { toggleSearch(false); resetSearch(); });

spClear.addEventListener('click', () => { spInput.value = ''; spClear.classList.remove('visible'); resetSearch(); });
spInput.addEventListener('input', () => {
  const q = spInput.value.trim();
  spClear.classList.toggle('visible', q.length > 0);
  exitProductView();
  activeQuery = q;
  doSearch(q);
});

spBack.addEventListener('click', () => {
  exitProductView();
  doSearch(spInput.value.trim());
});

function exitProductView() {
  spBack.classList.remove('visible');
  spSelected.classList.remove('visible');
  spRestoRes.style.display = 'none';
  spResults.style.display  = 'block';
  resetMarkers();
}

function resetSearch() {
  activeQuery = '';
  exitProductView();
  doSearch('');
}

function buildProductList(query) {
  const q = (query && query.length >= 2) ? query.toLowerCase() : null;

  // Étape 1 : pour chaque restaurant, collecter les noms de produits uniques
  const storeProducts = {};   // storeId → Set<nomLower>
  const productInfo   = {};   // nomLower → { nom, prix }

  Object.entries(menuCache).forEach(([storeId, data]) => {
    if (!data.menu) return;
    storeProducts[storeId] = new Set();
    Object.values(data.menu).forEach(prods => {
      prods.forEach(p => {
        const key = p.nom.toLowerCase();
        storeProducts[storeId].add(key);
        if (!productInfo[key]) productInfo[key] = { nom: p.nom, prix: p.prix };
      });
    });
  });

  // Étape 2 : liste de toutes les clés uniques (filtrées si query)
  const allKeys = new Set();
  Object.values(storeProducts).forEach(s => s.forEach(k => allKeys.add(k)));

  // Étape 3 : pour chaque produit, compter les restos qui l'ont (même logique que getState)
  const results = [];
  allKeys.forEach(key => {
    if (q && !key.includes(q)) return;
    const count = Object.values(storeProducts).filter(s => s.has(key)).length;
    results.push({ nom: productInfo[key].nom, prix: productInfo[key].prix, count });
  });

  return results.sort((a,b) => b.count - a.count || a.nom.localeCompare(b.nom));
}

function renderProductList(list, query) {
  if (list.length === 0) {
    const msg = query
      ? `<div class="sp-placeholder"><div class="ic">🔍</div>Aucun résultat pour "<strong>${esc(query)}</strong>".</div>`
      : '<div class="sp-placeholder"><div class="ic">⏳</div>Aucun menu chargé pour l\'instant…</div>';
    spResults.innerHTML = msg;
    return;
  }
  spResults.innerHTML = '';
  list.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'sri';
    item.style.animationDelay = (i*20)+'ms';
    item.innerHTML = `
      <div class="sri-name">${esc(p.nom)}</div>
      <div class="sri-price">${esc(p.prix)}</div>
      <div class="sri-count">${p.count} restaurant${p.count>1?'s':''}</div>`;
    item.addEventListener('click', () => selectProduct(p));
    spResults.appendChild(item);
  });
}

function doSearch(query) {
  resetMarkers();
  if (query && query.length === 1) return; // attendre au moins 2 chars
  const list = buildProductList(query && query.length >= 2 ? query : '');
  renderProductList(list, query && query.length >= 2 ? query : null);
}

function selectProduct(p) {
  spSelText.textContent = p.nom;
  spSelected.classList.add('visible');
  spBack.classList.add('visible');
  spResults.style.display  = 'none';
  spRestoRes.style.display = 'block';
  spRestoRes.innerHTML = '';

  const restos = window._restaurants || [];
  restos.forEach((r, i) => {
    const state = getState(r.id, p.nom);
    const labels = { found:'Disponible', missing:'Non disponible', unknown:'Menu non chargé' };
    const row = document.createElement('div');
    row.className = 'rri';
    row.style.animationDelay = (i*25)+'ms';
    row.innerHTML = `
      <div class="rri-dot ${state}"></div>
      <div class="rri-info">
        <div class="rri-name">${esc(r.name.replace("McDonald's ",''))}</div>
        <div class="rri-status ${state}">${labels[state]}</div>
      </div>`;
    spRestoRes.appendChild(row);
  });
  updateMarkers(p.nom);
}

function getState(storeId, productName) {
  if (!menuCache[storeId] || !menuCache[storeId].menu) return 'unknown';
  const key = productName.toLowerCase();
  // Correspondance exacte — cohérente avec buildProductList
  return Object.values(menuCache[storeId].menu).some(ps => ps.some(p => p.nom.toLowerCase() === key))
    ? 'found' : 'missing';
}

function updateMarkers(productName) {
  Object.entries(markerMap).forEach(([id, m]) => m.setIcon(makeIcon(getState(id, productName))));
}
function resetMarkers() {
  Object.entries(markerMap).forEach(([id, m]) => { if (markerOrigIcon[id]) m.setIcon(markerOrigIcon[id]); });
}

// ════════════════════════════════════════════════════════════════
//  BOOT — Chargement de tous les menus au démarrage
// ════════════════════════════════════════════════════════════════
const bootEl     = document.getElementById('boot');
const bootLabel  = document.getElementById('boot-label');
const bootBar    = document.getElementById('boot-bar');
const bootCounter= document.getElementById('boot-counter');
const bootPills  = document.getElementById('boot-pills');
const bootSkip   = document.getElementById('boot-skip');

const PILL_NAMES = {
  fr_caen_centre:'Centre', fr_caen_cote_de_nacre:'Côte de Nacre',
  fr_herouville:'Hérouville', fr_ouistreham:'Ouistreham',
  fr_rots:'Rots', fr_ifs:'Ifs', fr_mondeville:'Mondeville'
};

function dismissBoot() {
  bootEl.classList.add('out');
  setTimeout(() => { bootEl.style.display = 'none'; }, 650);
  document.getElementById('map-hint').classList.remove('hidden');
  // Ouvrir le panneau recherche et afficher tous les produits chargés
  toggleSearch(true);
  doSearch('');
}

bootSkip.addEventListener('click', dismissBoot);

async function bootLoadAll() {
  // 1. Démarrer le scraping côté serveur
  await fetch('/scrape-all-start', { method: 'POST' });

  const ids   = [...SCRAPPABLE];
  const total = ids.length;

  // Créer les pills
  const pills = {};
  ids.forEach(id => {
    const pill = document.createElement('span');
    pill.className = 'boot-pill';
    pill.textContent = PILL_NAMES[id] || id;
    bootPills.appendChild(pill);
    pills[id] = pill;
  });

  bootCounter.textContent = `0 / ${total}`;

  // 2. Polling /scrape-all-status
  let finished = false;
  while (!finished) {
    await new Promise(r => setTimeout(r, 2500));
    let status;
    try { status = await fetch('/scrape-all-status').then(r => r.json()); }
    catch(e) { continue; }

    // Mettre à jour les pills et le cache au fil de l'eau
    const done = status.done || [];
    let doneCount = 0;
    done.forEach(entry => {
      const pill = pills[entry.store_id];
      if (entry.error) {
        if (pill) pill.className = 'boot-pill error';
      } else {
        if (pill) pill.className = 'boot-pill done';
        if (entry.menu && Object.keys(entry.menu).length > 0) {
          menuCache[entry.store_id] = { menu: entry.menu, horaires: entry.horaires, jour: entry.jour };
        }
        doneCount++;
      }
    });

    // Pill active = en cours
    if (status.current && pills[status.current]) {
      pills[status.current].className = 'boot-pill active';
      bootLabel.textContent = `En cours : ${PILL_NAMES[status.current] || status.current}…`;
    }

    bootCounter.textContent = `${done.length} / ${total}`;
    bootBar.style.width = Math.round((done.length / total) * 100) + '%';

    finished = status.finished;
  }

  bootLabel.textContent = 'Tous les menus sont prêts !';
  bootBar.style.width = '100%';
  await new Promise(r => setTimeout(r, 800));
  dismissBoot();
}

// ════════════════════════════════════════════════════════════════
//  CHARGEMENT DES RESTAURANTS (marqueurs)
// ════════════════════════════════════════════════════════════════
fetch('/restaurants')
  .then(r => r.json())
  .then(restaurants => {
    window._restaurants = restaurants;
    restaurants.forEach(resto => {
      const status    = !resto.open ? 'closed' : (resto.unavailable?.length ? 'unavail' : 'open');
      const canScrape = SCRAPPABLE.has(resto.id);
      const icon      = makeIcon(status);

      const popup = `
        <div class="popup-name">${esc(resto.name)}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">${esc(resto.address)}</div>
        <div style="font-size:11px;margin-bottom:4px">
          ${status==='open'
            ? '<span style="color:var(--green)">● Ouvert</span>'
            : status==='closed'
              ? '<span style="color:var(--text-dim)">● Fermé</span>'
              : '<span style="color:var(--red)">● Indisponibilités</span>'}
        </div>
        ${canScrape
          ? `<button class="popup-btn" onclick="openMenu('${resto.id}')">Voir le menu</button>`
          : `<button class="popup-btn na" disabled>Menu non disponible</button>`}`;

      const marker = L.marker([resto.lat, resto.lng], { icon }).addTo(map).bindPopup(popup);
      markerMap[resto.id]      = marker;
      markerOrigIcon[resto.id] = icon;
    });

    // Lancer le boot une fois les marqueurs prêts
    bootLoadAll();
  })
  .catch(() => {
    bootLabel.textContent = 'Erreur de connexion au serveur.';
  });
</script>
